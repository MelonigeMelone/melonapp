[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [{ id = "RUSTSEC-2026-0374", reason = "Nur UniFFI-Binding-Generator: askama liest lokale Build-Konfiguration; nicht im App-Laufzeitgraph. Siehe sicherheit/apple-review.md; bei UniFFI-Updates erneut pruefen." }]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
