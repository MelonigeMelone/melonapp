name: Apple release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS notarized
    runs-on: macos-15
    environment: apple-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" = "$GITHUB_REF_NAME"
      - name: Signing material
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/apple/MelonApp.provisionprofile"
      - name: Build, sign and notarize
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_PROVISIONING_PROFILE: ${{ runner.temp }}/apple/MelonApp.provisionprofile
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple/AuthKey.p8
        run: bash scripts/build-macos-signed.sh --bundles app,dmg
      - name: Gatekeeper accepts the app and the disk image
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/MelonApp.app
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          for dmg in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-notarized
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "MelonApp $GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg --clobber
      - if: always()
        run: rm -rf "$RUNNER_TEMP/apple"

  ios:
    name: iOS to TestFlight
    runs-on: macos-15
    environment: apple-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: brew install xcodegen
      - run: npm ci
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" = "$GITHUB_REF_NAME"
      - name: Signing material
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/apple/private_keys"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/private_keys/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$IOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apple/distribution.p12"
          keychain="$RUNNER_TEMP/apple/signing.keychain-db"
          password=$(openssl rand -base64 24)
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/apple/distribution.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/apple/distribution.p12"
      - name: Build number
        run: |
          build="${{ github.run_number }}"
          sed -i '' "s/CFBundleVersion: \"[^\"]*\"/CFBundleVersion: \"$build\"/" apps/desktop/src-tauri/gen/apple/project.yml
          test "$(grep -c "CFBundleVersion: \"$build\"" apps/desktop/src-tauri/gen/apple/project.yml)" = 2
          echo "MELON_BUILD=$build" >> "$GITHUB_ENV"
      - run: bash scripts/build-apple-ffi.sh iphoneos
      - run: xcodegen generate --spec apps/desktop/src-tauri/gen/apple/project.yml
      - name: Archive and export for App Store Connect
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        run: npm run tauri -w desktop -- ios build --target aarch64 --export-method app-store-connect --ci --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$MELON_BUILD\"}}}"
      - name: Package contents
        run: |
          ipa=apps/desktop/src-tauri/gen/apple/build/arm64/MelonApp.ipa
          rm -rf "$RUNNER_TEMP/ipa" && mkdir "$RUNNER_TEMP/ipa" && unzip -q "$ipa" -d "$RUNNER_TEMP/ipa"
          app="$RUNNER_TEMP/ipa/Payload/MelonApp.app"
          extension="$app/PlugIns/MelonAutoFill.appex"
          ! otool -L "$extension/MelonAutoFill" | tail -n +2 | grep -v -e /usr/lib/ -e /System/Library/
          test "$(plutil -extract CFBundleVersion raw "$app/Info.plist")" = "$MELON_BUILD"
          test "$(plutil -extract CFBundleVersion raw "$extension/Info.plist")" = "$MELON_BUILD"
          test -f "$app/PrivacyInfo.xcprivacy"
          test -f "$extension/PrivacyInfo.xcprivacy"
          entitlements=$(codesign -d --entitlements :- "$extension" 2>/dev/null)
          grep -q group.de.melonigemelone.app <<<"$entitlements"
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/apple/private_keys
        run: xcrun altool --upload-app --type ios --file apps/desktop/src-tauri/gen/apple/build/arm64/MelonApp.ipa --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/apple/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/apple" "$RUNNER_TEMP/ipa"
