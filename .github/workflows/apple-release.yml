name: Apple release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Which apps to build
        type: choice
        options: [both, macos, ios]
        default: both

permissions:
  contents: read

concurrency:
  group: apple-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    name: macOS notarized
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'ios'
    runs-on: macos-15
    timeout-minutes: 360
    environment: apple-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" = "$GITHUB_REF_NAME"
      - name: Signing material
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          MELON_P12: ${{ secrets.APPLE_CERTIFICATE }}
          MELON_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          umask 077
          bash scripts/apple-keychain.sh "$RUNNER_TEMP/apple"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/AuthKey.p8"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/apple/MelonApp.provisionprofile"
      - name: Build and sign
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: Developer ID Application
          APPLE_PROVISIONING_PROFILE: ${{ runner.temp }}/apple/MelonApp.provisionprofile
        run: bash scripts/build-macos-signed.sh --bundles app
      - name: Notarize the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple/AuthKey.p8
        run: bash scripts/apple-notarize.sh apps/desktop/src-tauri/target/release/bundle/macos/MelonApp.app
      - name: Disk image
        env:
          APPLE_SIGNING_IDENTITY: Developer ID Application
        run: |
          version=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          bash scripts/macos-dmg.sh apps/desktop/src-tauri/target/release/bundle/macos/MelonApp.app "apps/desktop/src-tauri/target/release/bundle/dmg/MelonApp_${version}_aarch64.dmg"
      - name: Notarize the disk image
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple/AuthKey.p8
        run: |
          for dmg in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            bash scripts/apple-notarize.sh "$dmg"
          done
      - name: Gatekeeper accepts the app and the disk image
        run: |
          app=apps/desktop/src-tauri/target/release/bundle/macos/MelonApp.app
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          for dmg in apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-notarized
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --title "MelonApp $GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg --clobber
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/apple/signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/apple"

  ios:
    name: iOS to TestFlight
    if: github.event_name != 'workflow_dispatch' || inputs.platform != 'macos'
    runs-on: macos-15
    environment: apple-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios
      - name: Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          test -n "$xcode"
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: brew install xcodegen
      - run: npm ci
      - name: Tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)" = "$GITHUB_REF_NAME"
      - name: Signing material
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          MELON_P12: ${{ secrets.IOS_CERTIFICATE }}
          MELON_P12_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_APP: ${{ secrets.IOS_PROVISIONING_PROFILE_APP }}
          IOS_PROVISIONING_PROFILE_AUTOFILL: ${{ secrets.IOS_PROVISIONING_PROFILE_AUTOFILL }}
        run: |
          umask 077
          bash scripts/apple-keychain.sh "$RUNNER_TEMP/apple"
          mkdir -p "$RUNNER_TEMP/apple/private_keys"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple/private_keys/AuthKey_$APPLE_API_KEY.p8"
          printf '%s' "$IOS_PROVISIONING_PROFILE_APP" | base64 --decode > "$RUNNER_TEMP/apple/app.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_AUTOFILL" | base64 --decode > "$RUNNER_TEMP/apple/autofill.mobileprovision"
          python3 scripts/ios-export-options.py "$RUNNER_TEMP/apple" "${{ secrets.APPLE_TEAM_ID }}"
      - name: Build number and release signing
        run: |
          build="${{ github.run_number }}"
          ruby scripts/ios-release-signing.rb apps/desktop/src-tauri/gen/apple/project.yml "${{ secrets.APPLE_TEAM_ID }}" "$RUNNER_TEMP/apple/profiles.json" "$build"
          echo "MELON_BUILD=$build" >> "$GITHUB_ENV"
      - run: bash scripts/build-apple-ffi.sh iphoneos
      - run: xcodegen generate --spec apps/desktop/src-tauri/gen/apple/project.yml
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
      - name: Archive
        env:
          APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple/private_keys/AuthKey_${{ secrets.APPLE_API_KEY }}.p8
        run: npm run tauri -w desktop -- ios build -v --target aarch64 --export-method app-store-connect --archive-only --ci --config "{\"bundle\":{\"iOS\":{\"bundleVersion\":\"$MELON_BUILD\"}}}"
      - name: Archive entitlements
        run: |
          app=apps/desktop/src-tauri/gen/apple/build/melon-desktop_iOS.xcarchive/Products/Applications/MelonApp.app
          for bundle in "$app" "$app/PlugIns/MelonAutoFill.appex"; do
            echo "== $(basename "$bundle")"
            codesign -d --entitlements - "$bundle" 2>&1 || true
          done
          cat apps/desktop/src-tauri/gen/apple/MelonAutoFill/MelonAutoFill.entitlements
      - name: Export with the App Store profiles
        run: |
          xcodebuild -exportArchive \
            -archivePath apps/desktop/src-tauri/gen/apple/build/melon-desktop_iOS.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/apple/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          echo "MELON_IPA=$RUNNER_TEMP/export/MelonApp.ipa" >> "$GITHUB_ENV"
      - name: Package contents
        run: bash scripts/ios-check-ipa.sh "$MELON_IPA" "$MELON_BUILD"
      - name: Upload to TestFlight
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/apple/private_keys
        run: xcrun altool --upload-app --type ios --file "$MELON_IPA" --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"
      - if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/apple/signing.keychain-db" 2>/dev/null || true
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/"melon-*.mobileprovision "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"melon-*.mobileprovision
          rm -rf "$RUNNER_TEMP/apple" "$RUNNER_TEMP/ipa" "$RUNNER_TEMP/export"
