name: Windows app

on:
  push:
    branches: [main]
    paths: ["crates/**", "apps/desktop/**", "apps/web/**", "packages/**", "Cargo.*", "package*.json", ".nvmrc", "deny.toml", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["crates/**", "apps/desktop/**", "apps/web/**", "packages/**", "Cargo.*", "package*.json", ".nvmrc", "deny.toml", ".github/workflows/windows.yml"]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            apps/desktop/src-tauri -> target
      - run: npm ci
      - run: cargo install cargo-deny --locked
      - run: cargo deny --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc check
      - run: cargo test --locked -p melon-crypto -p melon-native
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked --lib
      - run: npm run tauri -w desktop -- build --bundles nsis
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-app-unsigned
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
