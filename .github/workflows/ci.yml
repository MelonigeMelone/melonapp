name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Format, lint, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: melon
          POSTGRES_PASSWORD: melon
          POSTGRES_DB: melon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U melon"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MELON_TEST_DATABASE_URL: postgres://melon:melon@localhost:5432/melon_test
      MELON_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    name: Web app (WASM, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: bash scripts/build-wasm.sh
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w web
      - run: npm run build -w web
      - run: npm test -w extension
      - run: npm run build -w extension
      - uses: actions/upload-artifact@v7
        with:
          name: melonapp-extension
          path: apps/extension/build

  e2e:
    name: End-to-end (browser against full stack)
    needs: web
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -p melon-e2e --env-file apps/web/e2e/e2e.env -f deploy/docker-compose.yml -f apps/web/e2e/compose.override.yml
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: $COMPOSE build
      - run: $COMPOSE up -d --wait
      - name: Wait for the API
        run: for i in $(seq 60); do curl -sf localhost:18081/health && exit 0; sleep 1; done; exit 1
      - name: Run browser test
        run: >-
          docker run --rm --network container:melon-e2e-caddy-1
          -v "$PWD/apps/web/e2e:/e2e" -v "$RUNNER_TEMP:/out" -w /work
          mcr.microsoft.com/playwright:v1.65.0-noble
          bash -c "npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.65.0 >/dev/null && cp /e2e/vault.e2e.mjs . && node vault.e2e.mjs"
      - uses: actions/download-artifact@v4
        with:
          name: melonapp-extension
          path: extension-build
      - name: Run extension test
        run: >-
          docker run --rm --network container:melon-e2e-caddy-1
          -v "$PWD/apps/extension/e2e:/e2e" -v "$PWD/extension-build/chromium:/ext" -v "$RUNNER_TEMP:/out" -w /work
          mcr.microsoft.com/playwright:v1.65.0-noble
          bash -c "npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.65.0 >/dev/null && cp /e2e/extension.e2e.mjs . && node extension.e2e.mjs"
      - name: Check that the database holds no plaintext
        run: |
          hits=$(docker exec melon-e2e-db-1 psql -U melon -d melon -tAc "SELECT count(*) FROM items JOIN vaults ON vaults.id = items.vault_id WHERE data ILIKE '%github%' OR data ILIKE '%melone%' OR data ILIKE '%wlan-geheim%' OR data ILIKE '%recovery-code%' OR encrypted_meta ILIKE '%familie%'")
          test "$hits" = "0"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/*.png
      - if: failure()
        run: $COMPOSE logs

  msrv:
    name: Minimum Rust version (1.87)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.87
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --locked
