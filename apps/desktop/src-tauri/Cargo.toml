[package]
name = "melon-desktop"
version = "0.3.1"
edition = "2024"
publish = false

[lib]
name = "melon_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
melon-native = { path = "../../../crates/melon-native" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sha2 = "0.11"
tempfile = "3"
base64 = "0.22"

[target.'cfg(target_os = "ios")'.dependencies]
objc2-foundation = { version = "0.3", features = ["NSFileManager", "NSString", "NSURL"] }
objc2-authentication-services = { version = "0.3", default-features = false, features = ["std", "block2", "ASCredentialIdentityStore"] }
libc = "0.2"

[dependencies.zeroize]
version = "1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
security-framework = { version = "3", features = ["OSX_10_15"] }

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2"
arboard = { version = "3", default-features = false }

[dev-dependencies]
melon-crypto = { path = "../../../crates/melon-crypto" }
melon-native = { path = "../../../crates/melon-native", features = ["test-support"] }

[lints.rust]
unsafe_code = "deny"

[workspace]
