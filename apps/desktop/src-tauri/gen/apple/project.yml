name: melon-desktop
options:
  bundleIdPrefix: de.melonigemelone.app
  deploymentTarget:
    iOS: 17.0
fileGroups: [../../src]
configs:
  debug: debug
  release: release
settingGroups:
  app:
    base:
      PRODUCT_NAME: MelonApp
      PRODUCT_BUNDLE_IDENTIFIER: de.melonigemelone.app
targetTemplates:
  app:
    type: application
    sources:
      - path: Sources
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      groups: [app]
targets:
  melon-desktop_iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Externals
        excludes: ["**/*.a"]
      - path: melon-desktop_iOS
      - path: assets
        buildPhase: resources
        type: folder
      - path: LaunchScreen.storyboard
      - path: ../../../apple/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: melon-desktop_iOS/Info.plist
      properties:
        LSRequiresIPhoneOS: true
        NSFaceIDUsageDescription: MelonApp entsperrt deinen verschlüsselten Tresor mit Face ID.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [arm64, metal]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: 0.3.0
        CFBundleVersion: "0.3.0"
    entitlements:
      path: melon-desktop_iOS/melon-desktop_iOS.entitlements
      properties:
        com.apple.security.application-groups: [group.de.melonigemelone.app]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    scheme:
      environmentVariables:
        RUST_BACKTRACE: full
        RUST_LOG: info
    settings:
      base:
        ENABLE_BITCODE: false
        ARCHS: [arm64]
        VALID_ARCHS: arm64 
        LIBRARY_SEARCH_PATHS[arch=x86_64]: $(inherited) $(PROJECT_DIR)/Externals/x86_64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        LIBRARY_SEARCH_PATHS[arch=arm64]: $(inherited) $(PROJECT_DIR)/Externals/arm64/$(CONFIGURATION) $(SDKROOT)/usr/lib/swift $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/$(PLATFORM_NAME) $(DEVELOPER_DIR)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift-5.0/$(PLATFORM_NAME)
        ALWAYS_EMBED_SWIFT_STANDARD_LIBRARIES: true
        EXCLUDED_ARCHS[sdk=iphoneos*]: x86_64
      groups: [app]
    dependencies:
      - target: MelonAutoFill
        embed: true
      - framework: libapp.a
        embed: false
      - sdk: CoreGraphics.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: QuartzCore.framework
      - sdk: Security.framework
      - sdk: UIKit.framework
      - sdk: WebKit.framework
    preBuildScripts:
      - script: |
          npm run -- tauri ios xcode-script -v --platform "${PLATFORM_DISPLAY_NAME:?}" --sdk-root "${SDKROOT:?}" --framework-search-paths "${FRAMEWORK_SEARCH_PATHS:?}" --header-search-paths "${HEADER_SEARCH_PATHS:?}" --gcc-preprocessor-definitions "${GCC_PREPROCESSOR_DEFINITIONS:-}" --configuration "${CONFIGURATION:?}" ${FORCE_COLOR} ${ARCHS:?}
        name: Build Rust Code
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Externals/x86_64/${CONFIGURATION}/libapp.a
          - $(SRCROOT)/Externals/arm64/${CONFIGURATION}/libapp.a

  MelonAutoFill:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ../../../apple/AutoFill
      - path: ../../../apple/Bindings/melon_ffi.swift
      - path: ../../../apple/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: MelonAutoFill/Info.plist
      properties:
        CFBundleDisplayName: MelonApp AutoFill
        CFBundleShortVersionString: 0.3.0
        CFBundleVersion: "0.3.0"
        NSFaceIDUsageDescription: MelonApp entsperrt deine Zugangsdaten mit Face ID.
        NSExtension:
          NSExtensionPointIdentifier: com.apple.authentication-services-credential-provider-ui
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).CredentialProviderViewController
          NSExtensionAttributes:
            ASCredentialProviderExtensionCapabilities:
              ProvidesPasswords: true
              ProvidesPasskeys: true
    entitlements:
      path: MelonAutoFill/MelonAutoFill.entitlements
      properties:
        com.apple.security.application-groups: [group.de.melonigemelone.app]
        com.apple.developer.authentication-services.autofill-credential-provider: true
    settings:
      base:
        ARCHS: [arm64]
        VALID_ARCHS: arm64
        PRODUCT_BUNDLE_IDENTIFIER: de.melonigemelone.app.autofill
        PRODUCT_NAME: MelonAutoFill
        SWIFT_VERSION: "5.0"
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/../../../apple/Bindings
        OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(SRCROOT)/../../../apple/Bindings/melon_ffiFFI.modulemap
        MELON_FFI_DIR[sdk=iphonesimulator*]: $(SRCROOT)/../../../../../target/aarch64-apple-ios-sim/release
        MELON_FFI_DIR[sdk=iphoneos*]: $(SRCROOT)/../../../../../target/aarch64-apple-ios/release
        OTHER_LDFLAGS: $(inherited) $(MELON_FFI_DIR)/libmelon_ffi.a
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ${APPLE_DEVELOPMENT_TEAM}
    dependencies:
      - sdk: AuthenticationServices.framework
      - sdk: Security.framework
      - sdk: LocalAuthentication.framework
    preBuildScripts:
      - script: bash "$SRCROOT/../../../../../scripts/build-apple-ffi.sh" "$PLATFORM_NAME"
        name: Build UniFFI
        basedOnDependencyAnalysis: false
