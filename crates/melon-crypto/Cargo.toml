[package]
name = "melon-crypto"
description = "Client-side cryptography for MelonApp: key derivation, encryption, password generation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
argon2 = { version = "0.6", features = ["zeroize"] }
base64 = "0.23"
chacha20poly1305 = "0.11"
data-encoding = "2"
hkdf = "0.13"
hpke = { version = "0.15", default-features = false, features = ["alloc", "x25519", "chacha"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "alloc", "getrandom"] }
ciborium = "0.2"
thiserror = "2"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true
