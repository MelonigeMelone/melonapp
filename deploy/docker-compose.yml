name: melonapp

services:
  db:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    restart: unless-stopped
    environment:
      POSTGRES_USER: melon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: melon
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U melon"]
      interval: 5s
      timeout: 5s
      retries: 10
    read_only: true
    tmpfs: [/tmp, /var/run/postgresql]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  db-setup:
    image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: melon
      PGDATABASE: melon
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v pw="$$PGPASSWORD" <<'SQL'
        SELECT 'CREATE ROLE melon_app LOGIN' WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'melon_app') \gexec
        ALTER ROLE melon_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'pw';
        ALTER DATABASE melon OWNER TO melon_app;
        ALTER SCHEMA public OWNER TO melon_app;
        DO $$$$
        DECLARE r record;
        BEGIN
          FOR r IN SELECT format('ALTER TABLE public.%I OWNER TO melon_app', tablename) AS q FROM pg_tables WHERE schemaname = 'public' AND tableowner <> 'melon_app'
            UNION ALL SELECT format('ALTER SEQUENCE public.%I OWNER TO melon_app', sequencename) FROM pg_sequences WHERE schemaname = 'public' AND sequenceowner <> 'melon_app'
            UNION ALL SELECT format('ALTER VIEW public.%I OWNER TO melon_app', viewname) FROM pg_views WHERE schemaname = 'public' AND viewowner <> 'melon_app'
          LOOP
            EXECUTE r.q;
          END LOOP;
        END $$$$;
        SQL
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  server:
    image: ${MELON_IMAGE:-ghcr.io/melonigemelone/melonapp-server:latest}
    build:
      context: ..
    restart: unless-stopped
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      MELON_DATABASE_URL: postgres://melon_app:${POSTGRES_PASSWORD}@db:5432/melon
      MELON_SERVER_SECRET: ${MELON_SERVER_SECRET:?set MELON_SERVER_SECRET in .env}
      MELON_ALLOW_REGISTRATION: ${MELON_ALLOW_REGISTRATION:-false}
      MELON_CORS_ORIGINS: ${MELON_CORS_ORIGINS:-}
      MELON_TRUST_PROXY: "true"
      RUST_LOG: info
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [internal]

  caddy-volumes:
    image: ${MELON_WEB_IMAGE:-ghcr.io/melonigemelone/melonapp-web:latest}
    entrypoint: ["sh", "-c", "chown -R 1000:1000 /data /config"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none

  caddy:
    image: ${MELON_WEB_IMAGE:-ghcr.io/melonigemelone/melonapp-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
      caddy-volumes:
        condition: service_completed_successfully
    user: "1000:1000"
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      MELON_DOMAIN: ${MELON_DOMAIN:?set MELON_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal, web]

volumes:
  db-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    internal: true
  web:
